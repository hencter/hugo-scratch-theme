#  与 i18n/en.toml 逐键对应：Hugo 只在「模板用到的键在本语言文件里缺失」时才告警，
#  所以新增键必须两边同时加，否则 --printI18nWarnings 会报缺翻译。
#  模板调用：{{ T "key" }} / {{ T "key" . }} / {{ T "key" 3 }}
# ============================================================================

