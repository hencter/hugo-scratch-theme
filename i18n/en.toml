# ============================================================================
#  i18n catalogue — English (en)
# ----------------------------------------------------------------------------
#  Rules that keep --printI18nWarnings silent:
#    · Every key used by a template must exist in EVERY language file.
#    · Keep the key order identical across languages so diffs stay readable.
#    · Pluralised keys need "one" and "other" even in languages that only use
#      "other" (zh-cn) — a missing plural bucket is a missing translation.
#  Call from a template with: {{ T "key" }} or {{ T "key" . }} / {{ T "key" 3 }}
# ============================================================================

[skipToContent]
other = "Skip to content"

[menu]
other = "Menu"

[mainNavigation]
other = "Main navigation"

[toggleNavigation]
other = "Toggle navigation"

[breadcrumb]
other = "Breadcrumb"

[home]
other = "Home"

[close]
other = "Close"

# --- Search ---------------------------------------------------------------
[search]
other = "Search"

[searchPlaceholder]
other = "Search pages…"

[searchHint]
other = "Type to filter. Press Esc to close."

[searchLoading]
other = "Loading search index…"

[searchNoResults]
other = "No pages match your query."

[searchResults]
# Not pluralised on purpose: the count is substituted in JavaScript, and a Go
# template action inside the string would be rendered (and lost) at build time.
other = "%d pages found"

